<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Comic Drawing Box</title>
  <style>
    body { text-align: center; font-family: sans-serif; background: #f4f4f4; }
    canvas { border: 3px solid black; background: white; cursor: crosshair; }
    button { margin-top: 10px; padding: 8px 15px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Draw Your Comic Panel</h1>
  <canvas id="comicCanvas" width="500" height="300"></canvas>

  <button id="downloadBtn">Download as PNG</button>

  <script>
    const canvas = document.getElementById('comicCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    canvas.addEventListener('mousedown', () => drawing = true);
    canvas.addEventListener('mouseup', () => drawing = false);
    canvas.addEventListener('mouseout', () => drawing = false);

    canvas.addEventListener('mousemove', draw);

    function draw(e) {
      if (!drawing) return;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'black';
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    }

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'comic-panel.png';
      link.href = canvas.toDataURL();
      link.click();
    });
  </script>
</body>
</html>

function zoomOut() { zoom -= 0.1; document.body.style.zoom = zoom; }
